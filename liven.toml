[server]
environment = "development"
host = "127.0.0.1"
db_port = 43121
webui_port = 43120
max_connections = 10000
broadcast_capacity = 4096


[security]
mode = "auth_key" # Options: "auth_key", "none"

[security.auth_key]
system_stream = "auth_keys"
allow_local_auto_generation = true


[storage]
data_directory = "./data"

# Maximum segment file size before a new segment is created.
# This key is read from [storage]; the duplicate under [limits] is ignored.
max_segment_size_mb = 1024

[limits]
# Maximum concurrent streams. Each stream has its own timestamp index.
max_concurrent_streams = 32

# Open file descriptor cache for segment files.
# Increase if you have many segments and frequent cold reads.
max_open_file_descriptors = 64

# Primary-index budget in MiB.
# If not set (or set to exactly 16), LIVEN auto-allocates 25% of detected
# host RAM, clamped to 32 MiB..4096 MiB. The 4 GiB value is an auto-detect
# ceiling, not a hard cap; an explicit larger value is accepted.
#
# The budget charges len("stream:key") + 128 bytes per live key: a 64-byte
# primary-index node and a 64-byte timestamp-index node. Actual RSS is slightly
# higher (allocator overhead): roughly 157 B/key for short keys and 192 B/key
# for 32-byte keys. See docs/RAM_CAPACITY.md.
# Approximate capacities:
# - 16 MiB  ≈ 87K 32-byte keys / 107K short keys
# - 64 MiB  ≈ 349K / 427K
# - 256 MiB ≈ 1.4M / 1.7M
# - 1 GiB   ≈ 5.6M / 6.8M
# - 4 GiB   ≈ 22M / 27M
# Uncomment to override auto-detection:
# max_index_ram_mb = 256

# Maximum number of records returned from full scan operations
max_scan_results = 100000

# Usage percentage at which the index high-water metric flips. Writes are
# still accepted until max_index_ram_mb is reached.
index_high_water_percent = 90

[retention]
# Fallback max-age for streams without an override. 0 disables retention.
default_max_age_secs = 0
# How often the server runs a segment-level retention pass.
check_interval_secs = 60

# Per-stream overrides, in seconds. Example:
# [retention.streams]
# events = 3600
# sessions = 600

# ============================================
# RECOMMENDED CONFIGURATION PROFILES
# ============================================
# Uncomment and adjust the following profiles based on your deployment scenario.
# These are NOT active TOML sections - they are examples only.

# --- Edge/Embedded Profile ---
# For resource-constrained devices (Raspberry Pi, IoT)
# [limits]
# max_concurrent_streams = 8
# max_open_file_descriptors = 16
# max_index_ram_mb = 32  # Override auto-detect for small devices
# max_scan_results = 10000

# --- Development Profile ---
# For local development with auto-detection
# [server]
# environment = "development"
# host = "127.0.0.1"
# [security]
# mode = "none"  # Auto-disabled for development

# --- Production Profile ---
# For server deployments
# [server]
# environment = "production"
# host = "0.0.0.0"
# [security]
# mode = "auth_key"  # Auto-enabled for production
# [security.auth_key]
# allow_local_auto_generation = false

# --- High-Volume Profile ---
# For systems with many streams and high throughput
# [limits]
# max_concurrent_streams = 64
# max_open_file_descriptors = 128
# max_scan_results = 500000
